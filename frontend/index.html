<!doctype html>
<html lang="es" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FEStudio Desarrollos | Software & Solutions</title>

    <!-- Tailwind CSS CDN oficial con la configuración exacta de FEStudio -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              brand: {
                dark: '#0e131f',
                card: '#161d2f',
                accent: '#10b981', // Neon/Green
                cyan: '#06b6d4',   // Tech Cyan
                amber: '#f59e0b',  // Glow Accent
                text: '#f3f4f6'
              }
            }
          }
        }
      }
    </script>

    <!-- Iconos FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
      .glow-effect {
        box-shadow: 0 0 25px -5px rgba(16, 185, 129, 0.3);
      }
      .glow-cyan {
        box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.3);
      }
      .glass-card {
        background: rgba(22, 29, 47, 0.75);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
    </style>
  </head>
  <body class="bg-brand-dark text-brand-text font-sans antialiased min-h-screen flex flex-col justify-between">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
